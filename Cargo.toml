[package]
name = "trgt-denovo"
version = "0.4.0"
authors = [
    "Tom Mokveld <tmokveld@pacificbiosciences.com>",
    "Egor Dolzhenko <edolzhenko@pacificbiosciences.com>",
]
description = """
trgt-denovo is a CLI tool for targeted de novo tandem repeat calling from long-read HiFI sequencing data in family trios or duos.
"""
edition = "2024"
license-file = "LICENSE.md"
build = "build.rs"

[[bin]]
bench = false
path = "src/main.rs"
name = "trgt-denovo"

[build-dependencies]
vergen-gitcl = { version = "1", features = ["build"] }

[dev-dependencies]
tempfile = "3"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rust-htslib = { version = "0.49", default-features = false }
clap = { version = "4.5", features = ["suggestions", "derive"] }
itertools = "0.14"
env_logger = "0.11"
owo-colors = { version = "4.2", features = ["supports-colors"] }
log = "0.4"
chrono = "0.4"
csv = "1.3"
ndarray = "0.17"
rayon = "1.8"
crossbeam-channel = "0.5"
anyhow = "1.0"
rust-wfa2 = { version = "0.1.0", git = "https://github.com/tmokveld/rust-wfa2.git", rev = "4eee33b33e8e7c91d51acdc2f70005bef49ac05c" }
